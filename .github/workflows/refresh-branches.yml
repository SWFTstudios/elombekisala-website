# Weekly refresh of the git branches the /garden/ bonsai are grown from.
# Re-reads every project repo (npm run branches), and only if a branch changed,
# rebuilds the site and commits the result to the default branch.
#
# Private repos (Snooze Lane) need a repository secret named BRANCHES_TOKEN:
# a fine-grained token with read-only "Contents" access to those repos.
# Without it, private repos are skipped and keep their last snapshot.
name: Refresh garden branches

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-branches
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'SWFTstudios/elombekisala-website'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore repo cache
        uses: actions/cache@v4
        with:
          path: .cache/repos
          key: branch-repos-${{ github.run_id }}
          restore-keys: branch-repos-

      - name: Read branches
        env:
          BRANCHES_TOKEN: ${{ secrets.BRANCHES_TOKEN }}
        run: npm run branches

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- src/build/data/branches.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No branch changes this week."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild site
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh garden branches"
          git push
