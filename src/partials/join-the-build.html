<section class="ek-section" id="join-the-build" data-analytics-view="join_the_build_view">
  <div class="ek-container" style="max-width: 36rem;">
    <h2>Join the Build</h2>
    <p class="ek-prose">Get behind-the-scenes updates on the businesses, websites, products, and creative projects I’m building—along with the lessons that come from figuring them out.</p>
    <form id="join-build-partial-form" class="ek-form ek-stack-md" action="https://formsubmit.co/elombekisala@gmail.com" method="POST" style="margin-top: 1.5rem;">
      <input type="hidden" name="_subject" value="Join the Build — new subscriber">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="https://elombekisala.com/join/thank-you/">
      <input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" class="ek-honeypot" style="position:absolute;left:-9999px;height:0;width:0;opacity:0;">
      <div class="ek-field">
        <label class="ek-label" for="join-partial-first-name">First name</label>
        <input type="text" id="join-partial-first-name" name="first_name" class="ek-input" required autocomplete="given-name">
      </div>
      <div class="ek-field">
        <label class="ek-label" for="join-partial-email">Email</label>
        <input type="email" id="join-partial-email" name="email" class="ek-input" required autocomplete="email">
      </div>
      <div class="ek-field">
        <label class="ek-label" for="join-partial-interest">What are you most interested in? (optional)</label>
        <select id="join-partial-interest" name="interest" class="ek-input">
          <option value="">Select an interest</option>
          <option value="Building a business">Building a business</option>
          <option value="Websites and design">Websites and design</option>
          <option value="Content creation and filmmaking">Content creation and filmmaking</option>
          <option value="Artificial intelligence and automation">Artificial intelligence and automation</option>
          <option value="Motorcycle and vinyl-wrap projects">Motorcycle and vinyl-wrap projects</option>
          <option value="Everything">Everything</option>
        </select>
      </div>
      <label class="ek-prose" style="display:flex;gap:0.5rem;align-items:flex-start;">
        <input type="checkbox" name="consent" value="yes" required style="margin-top:0.25rem;">
        <span>I agree to receive email updates. See the <a href="/privacy/">privacy policy</a>.</span>
      </label>
      <button type="submit" class="ek-btn" data-analytics="join_the_build_submit">Join the Build</button>
      <p class="ek-prose" style="font-size:0.9em;opacity:0.8;margin:0;">No spam. Just useful updates, new projects, and honest lessons from the process.</p>
    </form>
  </div>
</section>
